<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rezolv — High-Fidelity UI Design (Exact Figma Match)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #14263d;
      --orange: #00a884; /* Paleta Rece Figma: Vibrant Emerald Teal */
      --cream: #f8fafc;  /* Clean Slate Canvas */
      --paper: #ffffff;  /* Pure White Cards */
      --line: #e2e8f0;   /* Crisp Slate Border */
      --muted: #64748b;  /* Cool Slate Muted */
      --blue: #2563eb;
      --green: #10b981;
      --gold: #f59e0b;
      --soft-blue: #eff6ff;
      --soft-green: #ecfdf5;
      --soft-coral: #e6f7f4; /* Soft Teal Tint */
      --soft-gold: #fef3c7;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: #0f172a; /* Studio Figma Canvas Background */
      color: var(--navy);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding: 20px 10px 40px;
    }

    /* Device Mockup Shell (matches the screenshot) */
    .phone-container {
      width: 100%;
      max-width: 416px;
      height: 890px;
      max-height: 94vh;
      background: var(--cream);
      border-radius: 48px;
      box-shadow: 0 25px 60px -15px rgba(0,0,0,0.7), 0 0 0 10px #1e293b, 0 0 0 12px #334155;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Dynamic Island */
    .dynamic-island {
      position: absolute;
      top: 11px;
      left: 50%;
      transform: translateX(-50%);
      width: 115px;
      height: 30px;
      background: #000000;
      border-radius: 20px;
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 10px;
    }
    .camera-lens {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      background: #0f172a;
      border: 1px solid #1e293b;
    }

    /* Scrollable App Viewport */
    .app-viewport {
      width: 100%;
      height: 100%;
      overflow-y: auto;
      overflow-x: hidden;
      position: relative;
      -webkit-overflow-scrolling: touch;
      display: flex;
      flex-direction: column;
    }
    .app-viewport::-webkit-scrollbar { width: 4px; }
    .app-viewport::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

    img { display: block; }
    .pressable { cursor: pointer; user-select: none; -webkit-tap-highlight-color: transparent; transition: transform .1s, opacity .15s; }
    .pressable:active { transform: scale(0.98); }
    .disabled { cursor: not-allowed; opacity: .45; }

    /* Figma Layout Classes */
    .login-screen { min-height: 100%; background: var(--cream); padding: 52px 24px 32px; display: flex; flex-direction: column; justify-content: space-between; }
    .login-wrap { position: relative; }
    .login-header, .brand, .label-row, .app-header, .section-heading, .appointment-top, .appointment-meta, .pro-header, .summary-top, .request-state, .request-actions, .tier-head { display: flex; align-items: center; justify-content: space-between; }
    .brand { justify-content: flex-start; gap: 12px; }
    .brand-mark { width: 48px; height: 48px; border-radius: 14px; background: transparent; display: grid; place-items: center; flex: 0 0 48px; }
    .brand-mark svg { width: 48px; height: 48px; }
    .brand-name { font-weight: 800; font-size: 21px; letter-spacing: -.6px; line-height: 22px; color: var(--navy); }
    .brand-tagline { color: var(--orange); font-weight: 700; font-size: 8px; letter-spacing: 1.3px; text-transform: uppercase; margin-top: 1px; }
    .help { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; background: var(--paper); color: var(--muted); font-weight: 700; font-size: 15px; }
    .login-intro { margin-top: 40px; }
    .eyebrow { color: var(--orange); font-weight: 800; letter-spacing: 2.2px; font-size: 13px; text-transform: uppercase; }
    .display-title { font-weight: 800; font-size: 34px; line-height: 1.08; letter-spacing: -.9px; margin-top: 12px; color: var(--navy); }
    .lead { color: var(--muted); font-size: 15px; line-height: 24px; margin-top: 16px; }
    .login-form { margin-top: 32px; display: grid; gap: 18px; }
    .form-group { display: grid; gap: 8px; }
    .label { font-weight: 700; font-size: 13.5px; color: var(--navy); }
    .text-action { color: var(--orange); font-weight: 700; font-size: 12px; cursor: pointer; }
    .input-shell { min-height: 54px; display: flex; align-items: center; gap: 12px; background: #f1f5f9; border: 1px solid var(--line); border-radius: 22px; padding: 0 16px; transition: border-color .15s, background .15s; }
    .input-shell:focus-within { border-color: var(--orange); background: #ffffff; }
    .input-icon { width: 20px; color: var(--muted); display: grid; place-items: center; }
    .input-icon svg { width: 18px; height: 18px; }
    .trailing { margin-left: auto; cursor: pointer; }
    .field { width: 100%; border: 0; outline: 0; background: transparent; color: var(--navy); font-size: 15px; font-weight: 500; font-family: inherit; }
    .field::placeholder { color: var(--muted); opacity: .75; }
    .textarea { min-height: 96px; resize: none; padding: 12px 14px; border-radius: 16px; background: #f1f5f9; border: 1px solid var(--line); margin: 8px 0 16px; width: 100%; font-family: inherit; }
    .textarea:focus { outline: none; border-color: var(--orange); background: #ffffff; }
    .role-switch { display: grid; grid-template-columns: 1fr 1fr; background: #e2e8f0; border-radius: 24px; padding: 4px; gap: 4px; }
    .role-option { height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; border-radius: 20px; color: var(--muted); font-weight: 700; font-size: 13.5px; transition: all .15s ease; cursor: pointer; }
    .role-option.active { background: var(--paper); color: var(--navy); box-shadow: 0 2px 5px rgba(0,0,0,.08); }
    .role-glyph { color: var(--orange); display: flex; align-items: center; }
    .role-glyph svg { width: 18px; height: 18px; }
    .primary-button { background: var(--orange); color: white; min-height: 52px; border-radius: 999px; display: flex; align-items: center; justify-content: center; gap: 10px; text-align: center; font-weight: 700; font-size: 15px; box-shadow: 0 8px 18px rgba(0,168,132,.25); border: 0; outline: 0; cursor: pointer; width: 100%; }
    .login-button { min-height: 54px; font-size: 15px; margin-top: 4px; }
    .login-footer { color: var(--muted); text-align: center; display: grid; gap: 16px; margin-top: 32px; font-size: 13px; }
    .login-footer span { color: var(--orange); font-weight: 700; cursor: pointer; }
    .login-footer small { font-size: 11px; }
    .login-footer u { color: var(--orange); cursor: pointer; text-decoration: none; font-weight: 600; }

    /* App Screens */
    .app-shell { min-height: 100%; background: var(--cream); padding-bottom: 84px; position: relative; }
    .screen-content { padding: 48px 20px 32px; }
    .app-header { padding-bottom: 20px; }
    .location { color: var(--orange); font-size: 11px; font-weight: 800; letter-spacing: 2px; }
    .screen-title { font-size: 28px; line-height: 34px; font-weight: 800; letter-spacing: -.6px; margin-top: 3px; color: var(--navy); }
    .avatar { width: 46px; height: 46px; border: 2px solid var(--line); padding: 2px; border-radius: 50%; overflow: hidden; flex: 0 0 auto; background: white; }
    .avatar img { width: 100%; height: 100%; object-fit: cover; border-radius: 50%; }
    .avatar.large { width: 68px; height: 68px; }
    .search-shell { background: var(--paper); border: 1px solid var(--line); border-radius: 20px; height: 50px; display: flex; align-items: center; gap: 12px; padding: 0 16px; box-shadow: 0 1px 3px rgba(0,0,0,.04); }
    .search-shell svg { width: 18px; height: 18px; color: var(--muted); }
    .search-shell .field { font-size: 13.5px; font-weight: 500; }
    .section-block { margin-top: 22px; }
    .section-heading { margin-bottom: 12px; min-height: 26px; }
    .section-heading > div { font-size: 17px; font-weight: 800; letter-spacing: -.3px; color: var(--navy); }
    .section-heading > span { color: var(--orange); background: var(--soft-coral); border-radius: 999px; padding: 3px 8px; font-size: 10px; font-weight: 700; }
    .section-heading small { color: var(--muted); font-size: 11px; }
    .appointment-card, .request-card, .summary-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 16px; box-shadow: 0 2px 4px rgba(0,0,0,.04); }
    .appointment-top { gap: 10px; }
    .service-symbol, .category-icon { width: 38px; height: 38px; border-radius: 50%; background: var(--soft-blue); display: grid; place-items: center; flex: 0 0 auto; }
    .service-symbol svg, .category-icon svg { width: 20px; height: 20px; }
    .grow { flex: 1; min-width: 0; }
    .appointment-top strong, .appointment-top small, .schedule-card strong, .schedule-card small, .service-row strong, .service-row small, .profile-card strong, .profile-card small { display: block; }
    .appointment-top strong { font-size: 14px; font-weight: 700; color: var(--navy); }
    .appointment-top small { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .status { color: white; border-radius: 999px; padding: 4px 8px; font-size: 10px; font-weight: 700; }
    .accepted { background: var(--orange); }
    .completed-badge { background: var(--green); }
    .divider { height: 1px; background: var(--line); margin: 12px 0; }
    .appointment-meta { color: var(--muted); font-size: 11px; }
    .appointment-meta strong { color: var(--navy); font-size: 13px; }
    .inline-meta { display: inline-flex; align-items: center; gap: 6px; }
    .inline-meta svg { width: 13px; height: 13px; color: var(--muted); }
    .payment-note { background: #f1f5f9; color: var(--muted); border-radius: 12px; padding: 8px 10px; margin-top: 12px; display: flex; justify-content: space-between; font-size: 10px; }
    .category-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .category-card { min-height: 124px; padding: 14px; background: var(--paper); border: 1px solid var(--line); border-radius: 20px; display: flex; flex-direction: column; align-items: flex-start; box-shadow: 0 1px 3px rgba(0,0,0,.03); cursor: pointer; }
    .category-card strong { font-size: 12px; line-height: 14px; font-weight: 700; margin-top: auto; max-width: 130px; color: var(--navy); }
    .category-card small { color: var(--orange); font-size: 9px; font-weight: 600; margin-top: 4px; }
    .category-icon.blue { background: var(--soft-blue); }
    .category-icon.gold { background: var(--soft-gold); }
    .category-icon.green { background: var(--soft-green); }
    .category-icon.coral { background: var(--soft-coral); }

    /* Bottom Nav Bar */
    .bottom-nav { position: absolute; bottom: 0; left: 0; right: 0; z-index: 20; height: 70px; padding: 8px 16px 14px; background: rgba(255,255,255,.96); backdrop-filter: blur(12px); border-top: 1px solid var(--line); display: grid; grid-template-columns: repeat(4,1fr); }
    .nav-item { position: relative; display: flex; flex-direction: column; gap: 3px; align-items: center; justify-content: center; color: var(--muted); font-size: 10px; font-weight: 600; cursor: pointer; }
    .nav-item.active { color: var(--orange); font-weight: 700; }
    .nav-icon { width: 22px; height: 22px; display: grid; place-items: center; }
    .nav-icon svg { width: 20px; height: 20px; }
    .nav-item i { position: absolute; width: 6px; height: 6px; border-radius: 50%; background: var(--orange); top: 0; right: calc(50% - 14px); border: 1px solid var(--paper); }

    /* Discovery Screen */
    .hero { background: #0f172a; color: white; margin: -48px -20px 0; padding: 54px 20px 22px; border-radius: 0 0 28px 28px; }
    .trust-pill { display: inline-flex; padding: 6px 10px; border: 1px solid rgba(255,255,255,.2); border-radius: 999px; background: rgba(255,255,255,.08); font-size: 9px; font-weight: 600; }
    .hero-title { font-size: 28px; line-height: 32px; font-weight: 800; margin: 18px 0 16px; max-width: 290px; }
    .hero-search { height: 48px; border-radius: 24px; background: white; color: var(--muted); display: flex; gap: 10px; align-items: center; padding: 0 16px; font-size: 13px; }
    .hero-search svg { width: 16px; height: 16px; }
    .ai-card { margin-top: 14px; padding: 14px; border: 1px solid rgba(0,168,132,.3); border-radius: 16px; background: rgba(0,168,132,.12); backdrop-filter: blur(8px); display: grid; gap: 4px; cursor: pointer; }
    .ai-card strong { font-size: 13px; font-weight: 700; color: white; }
    .ai-card span { color: #a7f3d0; font-size: 11px; }
    .popular-scroll { display: grid; grid-auto-flow: column; grid-auto-columns: 180px; gap: 10px; overflow-x: auto; padding-bottom: 6px; scrollbar-width: none; }
    .popular-scroll::-webkit-scrollbar { display: none; }
    .popular-card { min-height: 200px; background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 14px; display: flex; flex-direction: column; align-items: flex-start; box-shadow: 0 1px 3px rgba(0,0,0,.03); cursor: pointer; }
    .popular-card > small { color: var(--muted); font-size: 8px; font-weight: 700; letter-spacing: .8px; margin-top: 14px; }
    .popular-card > strong { margin-top: 6px; font-size: 15px; line-height: 19px; font-weight: 700; color: var(--navy); }
    .popular-card > span { color: var(--orange); font-size: 10px; margin-top: 4px; }
    .popular-card > b { color: var(--navy); font-size: 11px; font-weight: 700; margin-top: auto; }
    .step-card { background: var(--paper); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; align-items: center; gap: 16px; margin-bottom: 10px; box-shadow: 0 1px 3px rgba(0,0,0,.02); }
    .step-card > b { color: var(--orange); font-size: 26px; font-weight: 900; }
    .step-card strong, .step-card small { display: block; }
    .step-card strong { font-size: 13.5px; font-weight: 700; color: var(--navy); }
    .step-card small { color: var(--muted); font-size: 11px; margin-top: 3px; }

    /* Simple & Profile Screens */
    .simple-header { margin-bottom: 22px; }
    .simple-header span { display: block; font-size: 26px; font-weight: 800; color: var(--navy); }
    .simple-header small { display: block; color: var(--muted); font-size: 12px; margin-top: 4px; }
    .empty-state { min-height: 380px; background: white; border: 2px dashed #cbd5e1; border-radius: 22px; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 28px; }
    .empty-icon { width: 80px; height: 80px; border-radius: 50%; background: #f1f5f9; color: var(--muted); display: grid; place-items: center; font-size: 24px; font-weight: 700; position: relative; }
    .empty-icon svg { width: 36px; height: 36px; opacity: .6; }
    .empty-state strong { font-size: 18px; font-weight: 800; margin-top: 20px; color: var(--navy); }
    .empty-state p { color: var(--muted); font-size: 12.5px; line-height: 18px; max-width: 250px; margin-top: 6px; }
    .compact { min-height: 40px; padding: 0 18px; font-size: 12px; }
    .profile-card { background: var(--paper); border: 1px solid var(--line); border-radius: 22px; padding: 22px; display: flex; flex-direction: column; align-items: center; gap: 6px; margin-bottom: 16px; box-shadow: 0 1px 3px rgba(0,0,0,.03); }
    .profile-card strong { font-size: 17px; font-weight: 800; margin-top: 6px; color: var(--navy); }
    .profile-card small { color: var(--muted); font-size: 12px; }
    .settings-row, .service-row { min-height: 58px; background: var(--paper); border-bottom: 1px solid var(--line); padding: 0 16px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; transition: background .12s; }
    .settings-row:hover { background: #f8fafc; }
    .settings-row:first-of-type { border-radius: 18px 18px 0 0; }
    .settings-row:last-of-type { border-bottom: 0; border-radius: 0 0 18px 18px; }
    .settings-row span { font-size: 13.5px; font-weight: 600; color: var(--navy); }
    .settings-row b { color: var(--muted); font-size: 20px; font-weight: 400; }
    .outline-button { min-height: 44px; border: 1px solid var(--line); border-radius: 999px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; background: var(--paper); color: var(--navy); cursor: pointer; transition: background .15s; width: 100%; margin-top: 18px; }
    .outline-button:hover { background: #f1f5f9; }

    /* Modals */
    .modal-backdrop { position: absolute; inset: 0; z-index: 100; background: rgba(15,23,42,.65); backdrop-filter: blur(4px); display: flex; align-items: flex-end; justify-content: center; }
    .modal { width: 100%; max-height: 90%; overflow-y: auto; background: var(--paper); border-radius: 28px 28px 0 0; padding: 14px 22px 24px; text-align: center; box-shadow: 0 -10px 40px rgba(0,0,0,.15); }
    .modal-handle { width: 40px; height: 5px; background: var(--line); border-radius: 999px; margin: 0 auto 18px; }
    .modal-icon { width: 54px; height: 54px; margin: 0 auto; border-radius: 50%; display: grid; place-items: center; color: white; font-size: 24px; font-weight: 800; }
    .modal-icon.success { background: var(--green); }
    .modal-title { font-size: 20px; font-weight: 800; margin-top: 14px; color: var(--navy); }
    .modal p { color: var(--muted); font-size: 12.5px; line-height: 18px; margin-top: 6px; }
    .stars { display: flex; align-items: center; justify-content: center; gap: 8px; margin: 18px 0 20px; }
    .stars .star-btn { color: #cbd5e1; font-size: 34px; line-height: 1; cursor: pointer; transition: color .15s; }
    .stars .star-btn.selected { color: var(--gold); }
    .modal .label { text-align: left; margin: 10px 0 6px; }
    .modal-later { color: var(--muted); font-size: 13px; font-weight: 700; padding: 12px; cursor: pointer; }
    .quote-modal { text-align: left; }
    .quote-modal .modal-title { text-align: center; }
    .quote-modal > p { text-align: center; margin-bottom: 20px; }
    .quote-modal .primary-button { margin-top: 20px; }
    .quote-modal .modal-later { text-align: center; display: block; }

    /* Meșter (Pro) Components */
    .pro-header { gap: 12px; }
    .promoted { border-color: var(--gold); }
    .pro-name { font-size: 17px; font-weight: 800; white-space: nowrap; color: var(--navy); }
    .pro-name span { vertical-align: 2px; color: white; background: var(--gold); border-radius: 999px; padding: 3px 6px; font-size: 8px; font-weight: 800; }
    .pro-header small { color: var(--muted); font-size: 10px; font-weight: 500; }
    .notification { width: 38px; height: 38px; border: 1px solid var(--line); border-radius: 50%; display: grid; place-items: center; position: relative; background: var(--paper); cursor: pointer; }
    .notification svg { width: 18px; height: 18px; color: var(--navy); }
    .notification i { position: absolute; width: 7px; height: 7px; background: var(--orange); border-radius: 50%; top: 4px; right: 5px; }
    .summary-card { margin-top: 20px; }
    .summary-top { color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .5px; }
    .summary-top b { color: var(--green); letter-spacing: 0; }
    .revenue { font-size: 26px; font-weight: 800; margin: 8px 0 10px; color: var(--navy); }
    .revenue small { color: var(--muted); font-size: 11px; }
    .revenue span { color: var(--muted); font-size: 10px; font-weight: 400; }
    .plan-status { background: #f1f5f9; color: var(--muted); padding: 9px 12px; border-radius: 12px; font-size: 10px; display: flex; justify-content: space-between; }
    .plan-status b { color: var(--orange); }
    .section-heading .count { color: white; background: var(--orange); border-radius: 999px; padding: 3px 7px; font-size: 9px; font-weight: 700; vertical-align: 1px; margin-left: 4px; }
    .orange { color: var(--orange) !important; cursor: pointer; }
    .request-card { margin-bottom: 12px; }
    .request-card.featured { border-color: #cbd5e1; box-shadow: 0 4px 12px rgba(0,0,0,.05); }
    .request-state span { color: var(--orange); background: var(--soft-coral); padding: 3px 7px; border-radius: 999px; font-size: 9px; font-weight: 700; }
    .request-state b { color: var(--muted); font-size: 10px; font-weight: 700; }
    .request-card > strong, .request-card > small { display: block; }
    .request-card > strong { font-size: 14.5px; font-weight: 700; margin-top: 10px; color: var(--navy); }
    .request-card > small { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .client-note { background: #f1f5f9; border-radius: 14px; padding: 10px 12px; font-size: 11px; line-height: 15px; margin-top: 10px; color: var(--navy); }
    .request-actions { gap: 8px; margin-top: 12px; }
    .request-actions .primary-button { flex: 1; }
    .request-actions .outline-button { min-width: 68px; margin-top: 0; }
    .schedule-card { background: var(--paper); border: 1px solid var(--line); border-radius: 18px; padding: 12px 14px; display: flex; gap: 12px; margin-bottom: 10px; overflow: hidden; position: relative; }
    .schedule-card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 4px; }
    .green-line::before { background: var(--green); }
    .blue-line::before { background: var(--blue); }
    .schedule-card > b { width: 56px; color: var(--green); font-size: 13.5px; font-weight: 700; border-right: 1px solid var(--line); }
    .blue-line > b { color: var(--blue); }
    .schedule-card > b small { font-size: 7px; margin-top: 6px; display: block; }
    .schedule-card div strong { font-size: 12px; color: var(--navy); }
    .schedule-card div small { color: var(--muted); font-size: 9px; margin-top: 2px; }
    .schedule-card div span { color: var(--green); font-size: 10px; font-weight: 700; display: block; margin-top: 5px; }
    .schedule-actions { color: var(--blue) !important; background: var(--soft-blue); border-radius: 999px; padding: 3px 7px; cursor: pointer; }
    .add-service-card { border: 1px solid #a7f3d0; background: #f0fdf4; border-radius: 20px; padding: 14px; margin-top: 18px; display: flex; flex-direction: column; align-items: center; text-align: center; }

            <div style="display: flex; justify-content: space-between; background: #f1f5f9; padding: 10px 14px; border-radius: 12px; font-size: 13px;">
              <strong>Luni – Vineri</strong>
              <span style="color: var(--muted);">08:00 – 18:30</span>
            </div>
            <div style="display: flex; justify-content: space-between; background: #f1f5f9; padding: 10px 14px; border-radius: 12px; font-size: 13px;">
              <strong>Sâmbătă</strong>
              <span style="color: var(--muted);">09:00 – 14:00</span>
            </div>
          </div>
          <button class="primary-button pressable" onclick="closeModal()">Închide</button>
        `;
      } else if (modalName === "proDocs") {
        innerContent = `
          <div class="modal-title">Documente & Verificări</div>
          <p>Atestate profesionale meșter</p>
          <div style="display: grid; gap: 10px; margin: 16px 0; text-align: left;">
            <div style="background: #f1f5f9; padding: 12px; border-radius: 14px;">
              <strong>Certificat de Înregistrare (CUI)</strong>
              <p style="color: var(--green); font-size: 12px; font-weight: bold; margin-top: 3px;">✓ Document Validat</p>
            </div>
            <div style="background: #f1f5f9; padding: 12px; border-radius: 14px;">
              <strong>Atestat Tehnic Instalații</strong>
              <p style="color: var(--green); font-size: 12px; font-weight: bold; margin-top: 3px;">✓ Document Validat</p>
            </div>
          </div>
          <button class="primary-button pressable" onclick="closeModal()">Închide</button>
        `;
      } else if (modalName === "proHelp") {
        innerContent = `
          <div class="modal-title">Suport Parteneri Meșteri</div>
          <p>Linie dedicată partenerilor Rezolv</p>
          <div style="text-align: left; background: #f1f5f9; padding: 14px; border-radius: 16px; margin: 16px 0; font-size: 13px; line-height: 20px;">
            📞 <strong>Linie prioritară meșteri:</strong> 0800 739 659<br />
            ✉️ <strong>Email suport:</strong> parteneri@rezolv.ro
          </div>
          <button class="primary-button pressable" onclick="closeModal()">Închide</button>
        `;
      } else if (modalName === "ai") {
        innerContent = `
          <div class="modal-title">Asistent AI Rezolv</div>
          <p>Diagnostic inteligent al problemei tale</p>
          <div style="text-align: left; background: #f1f5f9; padding: 14px; border-radius: 16px; margin: 16px 0; font-size: 13px; line-height: 20px;">
            💡 <strong>Cum funcționează:</strong><br />
            Descrie problema (ex: „picură țeava de sub chiuvetă” sau „nu pornește centrala”) și AI-ul îți recomandă imediat meșterul potrivit cu tarif estimat în Sibiu.
          </div>
          <button class="primary-button pressable" onclick="closeModal()">Încearcă</button>
        `;
      }

      return `
        <div class="modal-backdrop" onclick="if(event.target === this) closeModal()">
          <div class="modal">
            <div class="modal-handle"></div>
            ${innerContent}
          </div>
        </div>
      `;
    }

    // ================= ACTIONS & EVENT HANDLERS =================

    function setLoginRole(role) {
      loginRoleSelection = role;
      renderApp();
    }

    function togglePasswordVisibility() {
      const pwd = document.getElementById("loginPassword");
      if (pwd) {
        pwd.type = pwd.type === "password" ? "text" : "password";
      }
    }

    function performLogin() {
      currentRole = loginRoleSelection;
      clientTab = "home";
      proTab = "dashboard";
      renderApp();
    }

    function logout() {
      currentRole = null;
      renderApp();
    }

    function setClientTab(tab) {
      clientTab = tab;
      renderApp();
    }

    function setProTab(tab) {
      proTab = tab;
      renderApp();
    }

    function openModal(modalName, data) {
      currentModal = modalName;
      reviewSubmitted = false;
      renderApp();
    }

    function closeModal() {
      currentModal = null;
      renderApp();
    }

    function setRating(val) {
      activeRating = val;
      renderApp();
    }

    async function submitReview() {
      const txt = document.getElementById("reviewText");
      if (txt) reviewComment = txt.value;

      try {
        await fetch(`${API_URL}/reviews`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            booking_id: activeAppointment.id,
            pro_id: "pro-1",
            rating: activeRating,
            comment: reviewComment,
          }),
        });
      } catch (e) {
        // Fallback local persistence
      }

      activeAppointment.status = "completed";
      reviewSubmitted = true;
      renderApp();
    }

    async function acceptQuote() {
      const p = document.getElementById("quotePriceInput");
      const d = document.getElementById("quoteDurationInput");
      if (p) quotePrice = p.value;
      if (d) quoteDuration = d.value;

      try {
        await fetch(`${API_URL}/bookings/bk-001/status`, {
          method: "PATCH",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ status: "confirmed", price: quotePrice, duration: quoteDuration }),
        });
      } catch (e) {}

      proRequests = proRequests.filter(r => r.id !== "req-1");
      closeModal();
    }

    function rejectRequest(id) {
      proRequests = proRequests.filter(r => r.id !== id);
      renderApp();
    }

    function toggleProService(index) {
      proServices[index].active = !proServices[index].active;
      renderApp();
    }

    function setProSubscription(tier) {
      proSubscriptionTier = tier;
      renderApp();
    }

    function saveClientProfile() {
      const n = document.getElementById("inpName");
      const p = document.getElementById("inpPhone");
      const e = document.getElementById("inpEmail");
      if (n) profileData.name = n.value;
      if (p) profileData.phone = p.value;
      if (e) profileData.email = e.value;
      closeModal();
    }

    function saveClientAddress() {
      const a = document.getElementById("inpAddress");
      if (a) profileData.address = a.value;
      closeModal();
    }

    async function verifyCuiLive() {
      const inp = document.getElementById("inpCui");
      if (inp) proCuiNumber = inp.value;

      try {
        const res = await fetch(`${API_URL}/cui/verify`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ cui: proCuiNumber }),
        });
        const d = await res.json();
        if (d.company_name) {
          proCompanyName = d.company_name;
          proCuiVerified = d.is_verified;
        }
      } catch(e) {
        proCuiVerified = true;
      }
      alert(`CUI ${proCuiNumber} verificat cu succes! Companie activă: ${proCompanyName}`);
      closeModal();
    }

    function selectCategory(name) {
      setClientTab("search");
    }

    function handleSearch(q) {
      // live filter
    }

    function resetAllState() {
      currentRole = null;
      loginRoleSelection = "client";
      clientTab = "home";
      proTab = "dashboard";
      currentModal = null;
      activeAppointment.status = "accepted";
      renderApp();
    }

    // Initial Render
    renderApp();
  </script>
</body>
</html>
