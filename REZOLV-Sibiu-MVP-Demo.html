  const STORAGE_KEY = "rezolv_sibiu_mvp_demo_state_v4";

  window.__REZOLV_ASSET_MAP__ = ASSET_MAP;
  window.__REZOLV_DEMO_TOKEN__ = "demo-token-client";

  function clone(x) {
    return JSON.parse(JSON.stringify(x));
  }

  function loadState() {
    try {
      const raw = window.localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && parsed.users && parsed.pro_dashboard && parsed.pro_dashboard.pending) return parsed;
      }
    } catch (_) {}
    return clone(INITIAL_STATE);
  }

  let STATE = loadState();
  let ACTIVE_ROLE = "client";

  window.__REZOLV_INITIAL_USER__ = STATE.users.client;

  function saveState() {
    try {
      window.localStorage.setItem(STORAGE_KEY, JSON.stringify(STATE));
    } catch (_) {}
  }

  try {
    window.sessionStorage.setItem("rezolv_token", "demo-token-client");
  } catch (_) {}

  function findBookingEverywhere(bid) {
    const cb = STATE.client_bookings.find(b => b.id === bid);
    const pdPend = (STATE.pro_dashboard.pending || []).find(b => b.id === bid);
    const pdSch = (STATE.pro_dashboard.schedule || []).find(b => b.id === bid);
    return cb || pdPend || pdSch || null;
  }

  function syncBooking(updated) {
    const up = clone(updated);
    const idxC = STATE.client_bookings.findIndex(b => b.id === up.id);
    if (idxC >= 0) STATE.client_bookings[idxC] = up;
    else STATE.client_bookings.unshift(up);

    STATE.pro_dashboard.pending = (STATE.pro_dashboard.pending || []).filter(b => b.id !== up.id);
    STATE.pro_dashboard.schedule = (STATE.pro_dashboard.schedule || []).filter(b => b.id !== up.id);

    if (up.status === "pending" || up.status === "estimated") {
      STATE.pro_dashboard.pending.unshift(up);
    } else if (up.status === "accepted" || up.status === "completed") {
      STATE.pro_dashboard.schedule.unshift(up);
    }
    saveState();
  }

  function handleVirtualApi(method, urlStr, bodyObj, headers) {
    let path = "/api/me";
    let q = {};
    try {
      const u = new URL(urlStr, "http://localhost:8787");
      path = u.pathname;
      q = Object.fromEntries(u.searchParams.entries());
    } catch (_) {
      const qIdx = urlStr.indexOf("?");
      path = qIdx >= 0 ? urlStr.slice(0, qIdx) : urlStr;
    }

    const authHeader = (headers && (headers.Authorization || headers.authorization)) || "";
    if (authHeader.includes("demo-token-pro")) ACTIVE_ROLE = "pro";
    else if (authHeader.includes("demo-token-admin")) ACTIVE_ROLE = "admin";
    else if (authHeader.includes("demo-token-client")) ACTIVE_ROLE = "client";

    // Auth & Role Switch
    if (method === "POST" && (path === "/api/auth/login" || path === "/api/auth/demo-switch")) {
      const email = ((bodyObj && bodyObj.email) || "").toLowerCase();
      let role = (bodyObj && bodyObj.role) || "client";
      if (email.includes("admin")) role = "admin";
      else if (email.includes("mester") || email.includes("pro")) role = "pro";
      ACTIVE_ROLE = role;
      return {
        status: 200,
        body: {
          token: "demo-token-" + role,
          user: STATE.users[role] || STATE.users.client
        }
      };
    }

    if (method === "GET" && path === "/api/me") {
      return { status: 200, body: { user: STATE.users[ACTIVE_ROLE] || STATE.users.client } };
    }

    if (method === "PATCH" && path === "/api/me") {
      const uObj = STATE.users[ACTIVE_ROLE];
      if (bodyObj.name) uObj.name = bodyObj.name;
      if (bodyObj.phone) uObj.phone = bodyObj.phone;
      if (bodyObj.city) uObj.city = bodyObj.city;
      if (bodyObj.address) uObj.address = bodyObj.address;
      saveState();
      return { status: 200, body: { user: uObj } };
    }

    if (method === "GET" && path === "/api/categories") {
      return { status: 200, body: { categories: STATE.categories } };
    }

    if (method === "GET" && path === "/api/professionals") {
      let list = clone(STATE.professionals);
      if (q.category) {
        list = list
          .filter(p => (p.services || []).some(s => s.category === q.category))
          .map(p => Object.assign({}, p, {
            services: (p.services || []).filter(s => s.category === q.category)
          }));
      }
      if (q.q) {
        const needle = q.q.toLowerCase();
        list = list.filter(p =>
          p.name.toLowerCase().includes(needle) ||
          (p.headline || "").toLowerCase().includes(needle) ||
          (p.company_name || "").toLowerCase().includes(needle) ||
          (p.services || []).some(s => s.name.toLowerCase().includes(needle) || s.category.toLowerCase().includes(needle))
        );
      }
      return { status: 200, body: { professionals: list } };
    }

    const proMatch = path.match(/^\/api\/professionals\/([^/]+)$/);
    if (method === "GET" && proMatch) {
      const pid = decodeURIComponent(proMatch[1]);
      const det = STATE.pro_details[pid] || Object.values(STATE.pro_details)[0];
      return { status: 200, body: det };
    }

    if (method === "POST" && path === "/api/ai/recommend") {
      const prob = ((bodyObj && bodyObj.problem) || "").toLowerCase();
      let cat = "Instalații Sanitare";
      if (prob.includes("curent") || prob.includes("priz") || prob.includes("sigur")) cat = "Instalații Electrice";
      else if (prob.includes("auto") || prob.includes("frân") || prob.includes("motor")) cat = "Mecanică Auto";
      else if (prob.includes("cheie") || prob.includes("uș") || prob.includes("yal")) cat = "Lăcătuș";
      const pro = STATE.professionals.find(p => (p.services || []).some(s => s.category === cat)) || STATE.professionals[0];
      return {
        status: 200,
        body: {
          category: cat,
          reason: "Recomandat în Sibiu pe baza descrierii tale (timp mediu de răspuns 12 min, 0% comision).",
          price: "150 – 320 RON",
          urgency: "Disponibil azi în Sibiu",
          professional: pro
        }
      };
    }

    // Bookings & 3-Step Estimate Handshake
    if (method === "GET" && path === "/api/bookings") {
      return { status: 200, body: { bookings: STATE.client_bookings } };
    }

    if (method === "POST" && path === "/api/bookings") {
      const srvId = bodyObj.service_id;
      let matchedPro = STATE.professionals[0];
      let matchedSrv = (matchedPro.services || [])[0] || { id: "s_1", name: "Intervenție rapidă Sibiu", category: "Instalații Sanitare", price: "de la 150 RON" };
      for (const p of STATE.professionals) {
        const s = (p.services || []).find(x => x.id === srvId);
        if (s) {
          matchedPro = p;
          matchedSrv = s;
          break;
        }
      }
      const nowEpoch = Math.floor(Date.now() / 1000);
      const nb = bodyObj.neighborhood || "Hipodrom";
      const pw = bodyObj.preferred_window || bodyObj.scheduled_for || "Mâine, 09:00–12:00";
      const newB = {
        id: "b_demo_" + Date.now(),
        status: "pending",
        category: matchedSrv.category || "Instalații Sanitare",
        service_name: matchedSrv.name,
        price_label: matchedSrv.price || "de la 150 RON",
        description: bodyObj.description || "",
        neighborhood: nb,
        urgency_level: bodyObj.urgency_level || "normal",
        preferred_window: pw,
        quote_price: null,
        quote_price_max: null,
        quote_duration: null,
        duration_minutes: matchedSrv.est_duration_min || 60,
        pro_notes: null,
        scheduled_for: pw,
        scheduled_start_at: null,
        scheduled_end_at: null,
        created_at: nowEpoch,
        ago: "acum câteva secunde",
        time_label: pw,
        client: {
          id: STATE.users.client.id,
          name: STATE.users.client.name,
          neighborhood: nb,
          address: nb + ", Sibiu",
          phone: STATE.users.client.phone || "+40 721 555 010"
        },
        professional: {
          id: matchedPro.id,
          name: matchedPro.name,
          company_name: matchedPro.company_name,
          initials: matchedPro.initials
        },
        estimate: null,
        sms_reminders: [],
        review: null,
        can_review: false,
        photos: bodyObj.photos || []
      };
      syncBooking(newB);
      return { status: 200, body: { booking: newB } };
    }

    const estMatch = path.match(/^\/api\/bookings\/([^/]+)\/(estimate|quote)$/);
    if (method === "POST" && estMatch) {
      const bid = estMatch[1];
      const b = findBookingEverywhere(bid);
      if (!b) return { status: 404, body: { error: { message: "Lucrarea nu a fost găsită." } } };
      const nowEpoch = Math.floor(Date.now() / 1000);
      const price = Number(bodyObj.price || 260);
      const mins = Number(bodyObj.duration_minutes || 90);
      const durLabel = bodyObj.duration || (mins + " min");
      const startEpoch = Number(bodyObj.proposed_start_at || (nowEpoch + 86400));
      const endEpoch = startEpoch + mins * 60;
      const slotLabel = bodyObj.slot_label || "Mâine, 10:00–11:30";

      b.status = "estimated";
      b.quote_price = price;
      b.quote_price_max = bodyObj.price_max ? Number(bodyObj.price_max) : null;
      b.quote_duration = durLabel;
      b.duration_minutes = mins;
      b.scheduled_start_at = startEpoch;
      b.scheduled_end_at = endEpoch;
      b.scheduled_for = slotLabel;
      b.time_label = slotLabel;
      b.pro_notes = bodyObj.pro_notes || "Deviz estimativ (include deplasarea în Sibiu și garanția manoperei).";
      b.estimate = {
        id: "est_" + Date.now(),
        booking_id: b.id,
        pro_id: b.professional.id,
        price_ron: price,
        price_max_ron: b.quote_price_max,
        duration_minutes: mins,
        duration_label: durLabel,
        proposed_start_at: startEpoch,
        proposed_end_at: endEpoch,
        slot_label: slotLabel,
        pro_notes: b.pro_notes,
        status: "sent",
        expires_at: nowEpoch + 86400,
        created_at: nowEpoch
      };
      syncBooking(b);
      return { status: 200, body: { booking: b } };
    }

    const accMatch = path.match(/^\/api\/bookings\/([^/]+)\/accept-estimate$/);
    if (method === "POST" && accMatch) {
      const bid = accMatch[1];
      const b = findBookingEverywhere(bid);
      if (!b) return { status: 404, body: { error: { message: "Lucrarea nu a fost găsită." } } };
      const nowEpoch = Math.floor(Date.now() / 1000);
      b.status = "accepted";
      if (b.estimate) {
        b.estimate.status = "accepted";
      }
      b.sms_reminders = [
        {
          id: "sms_conf_" + Date.now(),
          booking_id: b.id,
          recipient_phone: "+40721555010",
          reminder_type: "booking_confirmed",
          status: "sent",
          scheduled_for: nowEpoch,
          sent_at: nowEpoch,
          provider_sid: "SM_TWILIO_CONF_" + Date.now(),
          message_body: "REZOLV Sibiu: Programare confirmată cu " + b.professional.name + " (" + b.scheduled_for + "). Preț estimat: " + b.quote_price + " RON."
        },
        {
          id: "sms_24h_" + Date.now(),
          booking_id: b.id,
          recipient_phone: "+40721555010",
          reminder_type: "reminder_24h",
          status: "scheduled",
          scheduled_for: nowEpoch + 3600,
          sent_at: null,
          provider_sid: null,
          message_body: "Reminder 24h REZOLV Sibiu: Mâine are loc lucrarea „" + b.service_name + "” cu " + b.professional.name + "."
        },
        {
          id: "sms_2h_" + Date.now(),
          booking_id: b.id,
          recipient_phone: "+40721555010",
          reminder_type: "reminder_2h",
          status: "scheduled",
          scheduled_for: nowEpoch + 7200,
          sent_at: null,
          provider_sid: null,
          message_body: "Reminder 2h REZOLV Sibiu: Meșterul " + b.professional.name + " ajunge în 2 ore la adresa ta din Sibiu."
        }
      ];
      syncBooking(b);
      if (STATE.pro_dashboard.calendar && STATE.pro_dashboard.calendar.days && STATE.pro_dashboard.calendar.days[1]) {
        const freeSlot = STATE.pro_dashboard.calendar.days[1].slots.find(s => s.status === "free");
        if (freeSlot) {
          freeSlot.status = "accepted";
          freeSlot.booking = clone(b);
        }
      }
      saveState();
      return { status: 200, body: { booking: b } };
    }

    const decMatch = path.match(/^\/api\/bookings\/([^/]+)\/decline-estimate$/);
    if (method === "POST" && decMatch) {
      const bid = decMatch[1];
      const b = findBookingEverywhere(bid);
      if (b) {
        b.status = "pending";
        b.estimate = null;
        syncBooking(b);
      }
      return { status: 200, body: { booking: b } };
    }

    const reschMatch = path.match(/^\/api\/bookings\/([^/]+)\/reschedule$/);
    if (method === "POST" && reschMatch) {
      const bid = reschMatch[1];
      const b = findBookingEverywhere(bid);
      const newLabel = (bodyObj && bodyObj.slot_label) || "Mâine, 14:00";
      if (b) {
        b.scheduled_for = newLabel;
        b.time_label = newLabel;
        if (bodyObj && bodyObj.start_at) b.scheduled_start_at = bodyObj.start_at;
        syncBooking(b);
      }
      if (STATE.pro_dashboard.calendar && STATE.pro_dashboard.calendar.days) {
        for (const d of STATE.pro_dashboard.calendar.days) {
          for (const s of d.slots) {
            if (s.booking && s.booking.id === bid) {
              s.status = "free";
              s.booking = null;
            }
          }
        }
        if (bodyObj && bodyObj.start_at) {
          for (const d of STATE.pro_dashboard.calendar.days) {
            for (const s of d.slots) {
              if (s.start_at === bodyObj.start_at && b) {
                s.status = b.status;
                s.booking = clone(b);
              }
            }
          }
        }
      }
      saveState();
      return { status: 200, body: { booking: b } };
    }

    const smsTrigMatch = path.match(/^\/api\/bookings\/([^/]+)\/sms-trigger$/);
    if (method === "POST" && smsTrigMatch) {
      const bid = smsTrigMatch[1];
      const b = findBookingEverywhere(bid);
      const nowEpoch = Math.floor(Date.now() / 1000);
      const dispatched = [];
      if (b && b.sms_reminders) {
        for (const r of b.sms_reminders) {
          r.status = "sent";
          r.sent_at = nowEpoch;
          r.provider_sid = "SM_TWILIO_LIVE_" + Date.now();
          dispatched.push(r);
        }
        syncBooking(b);
      }
      saveState();
      return { status: 200, body: { dispatched: dispatched, booking: b } };
    }

    const cancelMatch = path.match(/^\/api\/bookings\/([^/]+)\/(cancel|refuse|complete)$/);
    if (method === "POST" && cancelMatch) {
      const bid = cancelMatch[1];
      const act = cancelMatch[2];
      const b = findBookingEverywhere(bid);
      if (b) {
        b.status = act === "complete" ? "completed" : act === "refuse" ? "refused" : "cancelled";
        if (act === "complete") b.can_review = true;
        syncBooking(b);
      }
      return { status: 200, body: { booking: b } };
    }

    const revMatch = path.match(/^\/api\/bookings\/([^/]+)\/review$/);
    if (method === "POST" && revMatch) {
      const bid = revMatch[1];
      const b = findBookingEverywhere(bid);
      if (b) {
        b.review = { rating: Number(bodyObj.rating || 5), comment: bodyObj.comment || "" };
        b.can_review = false;
        syncBooking(b);
      }
      return { status: 200, body: { booking: b } };
    }

    // Pro B2B endpoints
    if (method === "GET" && path === "/api/pro/dashboard") {
      return { status: 200, body: STATE.pro_dashboard };
    }
    if (method === "GET" && path === "/api/pro/calendar") {
      return { status: 200, body: STATE.pro_calendar };
    }
    if (method === "GET" && path === "/api/pro/categories") {
      return { status: 200, body: { categories: STATE.pro_categories } };
    }
    const proCatToggle = path.match(/^\/api\/pro\/categories\/([^/]+)$/);
    if (method === "PUT" && proCatToggle) {
      const cname = decodeURIComponent(proCatToggle[1]);
      const cat = STATE.pro_categories.find(c => c.category === cname);
      if (cat) cat.enabled = Boolean(bodyObj.enabled);
      saveState();
      return { status: 200, body: { categories: STATE.pro_categories } };
    }
    if (method === "POST" && path === "/api/pro/services") {
      if (STATE.pro_categories[0]) {
        STATE.pro_categories[0].services.push({
          id: "srv_" + Date.now(),
          name: bodyObj.name,
          price_from: Number(bodyObj.price_from || 150),
          duration: bodyObj.duration || "1 oră"
        });
      }
      saveState();
      return { status: 200, body: { categories: STATE.pro_categories } };
    }
    if (method === "PATCH" && path === "/api/pro/profile") {
      const uObj = STATE.users.pro;
      if (uObj && uObj.pro) {
        if (bodyObj.headline !== undefined) uObj.pro.headline = bodyObj.headline;
        if (bodyObj.bio !== undefined) uObj.pro.bio = bodyObj.bio;
        if (bodyObj.zones !== undefined) uObj.pro.zones = bodyObj.zones;
        if (bodyObj.hours !== undefined) uObj.pro.hours = bodyObj.hours;
      }
      saveState();
      return { status: 200, body: { user: uObj } };
    }
    if (method === "GET" && path === "/api/subscription") {
      return { status: 200, body: STATE.pro_subscription };
    }
    if (method === "POST" && path === "/api/subscription/checkout") {
      STATE.pro_subscription.plan = bodyObj.plan || "pro";
      STATE.pro_subscription.status = "active";
      saveState();
      return { status: 200, body: STATE.pro_subscription };
    }
    if (method === "GET" && path === "/api/notifications") {
      const list = STATE.notifications[ACTIVE_ROLE] || [];
      return { status: 200, body: { notifications: list, unread: list.filter(x => !x.read).length } };
    }
    if (method === "POST" && path === "/api/notifications/read") {
      return { status: 200, body: { ok: true } };
    }

    // Super-Admin endpoints
    if (method === "GET" && path === "/api/admin/overview") {
      return { status: 200, body: STATE.admin_overview };
    }
    if (method === "POST" && path === "/api/admin/cui-lookup") {
      const rawCui = ((bodyObj && bodyObj.cui) || "RO45612301").toUpperCase();
      return {
        status: 200,
        body: {
          cui: rawCui.startsWith("RO") ? rawCui : "RO" + rawCui,
          valid: true,
          company_name: "SIBIU MEȘTER SERVICE S.R.L.",
          city: "Sibiu",
          address: "Str. Calea Dumbrăvii nr. 48, Sibiu",
          source: "anaf_live_demo"
        }
      };
    }
    if (method === "POST" && path === "/api/admin/pros/onboard") {
      const newPro = {
        id: "pro_onb_" + Date.now(),
        name: bodyObj.name || "Meșter Nou Sibiu",
        email: bodyObj.email || "nou@rezolv.ro",
        phone: bodyObj.phone || "+40 744 000 111",
        city: "Sibiu",
        company_name: bodyObj.company_name || "SIBIU MEȘTER S.R.L.",
        cui: bodyObj.cui || "RO45612301",
        categories: [bodyObj.category || "Instalații Sanitare"],
        headline: bodyObj.headline || (bodyObj.category + " • Sibiu"),
        verification_status: "verified",
        onboarded_by_admin: true,
        plan: "pro",
        plan_status: bodyObj.plan_status || "active",
        price_eur: 39,
        rating: 5.0,
        jobs: 0,
        zones: bodyObj.zones || ["Hipodrom", "Șelimbăr", "Centru Istoric"],
        services_count: (bodyObj.services || []).length || 3
      };
      STATE.admin_overview.professionals.unshift(newPro);
      STATE.admin_overview.analytics.unit_economics.active_b2b_pros += 1;
      STATE.admin_overview.analytics.unit_economics.mrr_eur += 39;
      STATE.admin_overview.analytics.unit_economics.mrr_ron += 195;
      STATE.admin_overview.analytics.unit_economics.arr_eur += 39 * 12;
      saveState();
      return {
        status: 200,
        body: {
          onboarded: {
            user_id: newPro.id,
            name: newPro.name,
            email: newPro.email,
            company_name: newPro.company_name,
            cui: newPro.cui,
            category: bodyObj.category || "Instalații Sanitare",
            verified: true,
            plan_status: newPro.plan_status,
            subscription_eur: 39,
            temp_password: "Mestersibiu2026!"
          }
        }
      };
    }
    const subPatchMatch = path.match(/^\/api\/admin\/pros\/([^/]+)\/subscription$/);
    if (method === "PATCH" && subPatchMatch) {
      const pid = subPatchMatch[1];
      const p = STATE.admin_overview.professionals.find(x => x.id === pid);
      if (p) {
        if (bodyObj.plan_status) p.plan_status = bodyObj.plan_status;
        if (bodyObj.plan) p.plan = bodyObj.plan;
      }
      saveState();
      return { status: 200, body: { ok: true } };
    }
    if (method === "POST" && path === "/api/admin/sms/trigger-due") {
      let count = 0;
      const dispatched = [];
      for (const s of (STATE.admin_overview.sms_queue || [])) {
        if (s.status === "scheduled") {
          s.status = "sent";
          s.sent_at = Math.floor(Date.now() / 1000);
          s.provider_sid = "SM_TWILIO_BATCH_" + Date.now();
          dispatched.push(s);
          count++;
        }
      }
      saveState();
      return { status: 200, body: { dispatched_count: count, dispatched: dispatched } };
    }

    return { status: 200, body: { ok: true } };
  }

  const origFetch = window.fetch.bind(window);
  window.fetch = async function(input, init) {
    const urlStr = typeof input === "string" ? input : (input && input.url) || "";
    if (urlStr.includes("/api/")) {
      const method = ((init && init.method) || "GET").toUpperCase();
      let bodyObj = {};
      if (init && init.body && typeof init.body === "string") {
        try { bodyObj = JSON.parse(init.body); } catch (_) {}
      }
      const res = handleVirtualApi(method, urlStr, bodyObj, (init && init.headers) || {});
      return new Response(JSON.stringify(res.body), {
        status: res.status || 200,
        headers: { "Content-Type": "application/json" }
      });
    }
    return origFetch(input, init);
  };
})();
